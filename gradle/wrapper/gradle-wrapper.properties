distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 8.2.2 requires Gradle 8.2–8.3, and Kotlin 1.9.22 is tested up to ~8.3 — pin 8.2.1 in that
# overlap so the build is reproducible. The wrapper jar + gradlew/gradlew.bat scripts ARE committed
# alongside this file (official Gradle 8.2.1, checksum-verified), so `./gradlew` works on a fresh clone.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
