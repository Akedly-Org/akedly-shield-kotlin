distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 8.2.2 requires Gradle 8.2–8.3, and Kotlin 1.9.22 is tested up to ~8.3 — pin 8.2.1 in that
# overlap so the build is reproducible. NOTE: the binary gradle-wrapper.jar + gradlew/gradlew.bat
# scripts are not committed here (they are binaries); generate them once on a machine with Gradle:
#   gradle wrapper --gradle-version 8.2.1
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
